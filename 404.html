<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Pagina niet gevonden — sitewerk.</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#FAFAF7;color:#181B21;font-family:"Hanken Grotesk",system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
.wordmark{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.dot{color:#1C39A6}
h1{font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.025em;margin:18px 0 10px}
p{color:#565D66;margin:0 0 28px}
a.btn{display:inline-block;text-decoration:none;font-weight:600;background:#1C39A6;color:#fff;padding:14px 26px;border-radius:12px}
</style>
</head>
<body>
<div>
  <div class="wordmark">sitewerk<span class="dot">.</span></div>
  <h1>Deze pagina bestaat niet.</h1>
  <p>Geen zorgen — alles wat je zoekt staat op de startpagina.</p>
  <a class="btn" href="/">Naar de startpagina</a>
</div>
</body>
</html>
